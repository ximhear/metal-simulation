name: GalaxyCollision
options:
  bundleIdPrefix: dev.gzonelee
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.1.2'
    CURRENT_PROJECT_VERSION: '4'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GalaxyCollision:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [GalaxyCollision]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gzonelee.GalaxyCollision
        PRODUCT_NAME: GalaxyCollision
        INFOPLIST_KEY_CFBundleDisplayName: Galaxy Lab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: GalaxyCollision/GalaxyCollision.entitlements
schemes:
  GalaxyCollision:
    build:
      targets:
        GalaxyCollision: all
